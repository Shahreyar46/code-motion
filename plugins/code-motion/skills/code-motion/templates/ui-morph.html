<title>code-motion · one-shape UI morph template</title>
<!--
  Template: Dribbble-style UI motion loop (style 6). One shape never cuts: it morphs size/radius/colour
  through UI states while its content swaps with a short blur; a cursor drives every change; the camera
  zooms so each state fills the frame; the last frame equals the first so it loops.
  No VO needed (literal times on a 120 BPM grid = 0.5 s per beat). Render 1:1 or 16:9.
  Markup contract for M.morph: #world > #shape > .L layers, plus #cursor.
-->
<style>
  #stage{color:#0B0B0B}
  .lbl{font-weight:600;font-size:34px;white-space:nowrap;transform:translate(-50%,-50%);position:absolute}
  .knob{position:absolute;width:86px;height:86px;border-radius:43px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .bar{position:absolute;height:14px;border-radius:7px;background:#E7E5E0}
</style>
<div id="world"><div id="shape">
  <div class="L" id="Lbtn"><div class="lbl" style="color:#fff">Generate</div></div>
  <div class="L" id="Lbtn2"><div class="lbl" style="color:#fff">Generate</div></div>
  <div class="L" id="Lload"><svg width="56" height="56" viewBox="0 0 56 56" style="position:absolute;left:-28px;top:-28px"><circle cx="28" cy="28" r="22" stroke="rgba(255,255,255,.25)" stroke-width="6" fill="none"/><path id="arc" d="M28 6 A22 22 0 0 1 50 28" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></svg></div>
  <div class="L" id="Ldone"><div id="chk" style="position:absolute;left:-24px;top:-24px"></div></div>
  <div class="L" id="Ltog"><div class="knob" id="knob"></div></div>
  <div class="L" id="Lcard" style="">
    <div class="lbl" style="left:0;top:-140px;transform:translate(-50%,0);font-size:40px">Ready to ship</div>
    <div class="bar" id="b0" style="left:-250px;top:-40px"></div><div class="bar" id="b1" style="left:-250px;top:0"></div><div class="bar" id="b2" style="left:-250px;top:40px"></div>
    <div class="lbl" style="left:0;top:120px;transform:translate(-50%,-50%);font-size:28px;color:#fff;background:#0B0B0B;padding:18px 36px;border-radius:30px">Publish</div>
  </div>
</div></div>
<div id="cursor"></div>

<script>
const SQ = M.AR==='16x9' ? [1920,1080] : [1080,1080];
const B = 0.5;                                   // one beat at 120 BPM
const tClick1=1*B+0.3, tDone=tClick1+2*B, tTog=tDone+2*B, tTogClick=tTog+B+0.2, tCard=tTogClick+B, tPub=tCard+4*B, T=tPub+2*B;
M.$('chk').innerHTML=M.icon('check',48,'#fff',3.2);
M.morph({
  W:SQ[0], H:SQ[1], T, bg:'#E9E7E2', intro:0.1,
  SH:{ btn:{w:340,h:96,r:48,bg:'#0B0B0B',cam:1.7}, load:{w:96,h:96,r:48,bg:'#0B0B0B',cam:2.0}, done:{w:96,h:96,r:48,bg:'#16A34A',cam:2.0},
       tog:{w:200,h:110,r:55,bg:'#D6D3CC',cam:1.9}, togOn:{w:200,h:110,r:55,bg:'#FF5A1F',cam:1.9},
       card:{w:640,h:420,r:36,bg:'#FFFFFF',cam:1.25}, end:{w:340,h:96,r:48,bg:'#0B0B0B',cam:1.7} },
  start:'btn', SEQ:[[tClick1,'load'],[tDone,'done'],[tTog,'tog'],[tTogClick,'togOn'],[tCard,'card'],[tPub,'end']],
  shapePress:[tClick1,tTogClick],
  layers:[
    {el:'Lbtn', tin:0.1, tout:tClick1},
    {el:'Lload', tin:tClick1, tout:tDone, update:(t)=>{M.$('arc').setAttribute('transform',`rotate(${(t*540)%360} 28 28)`);}},
    {el:'Ldone', tin:tDone, tout:tTog},
    {el:'Ltog', tin:tTog, tout:tCard, update:(t)=>{const k=M.sp(t,tTogClick,M.FAST); M.$('knob').style.left=(-89+M.lerp(0,90,k))+'px'; M.$('knob').style.top='-43px'; M.$('knob').style.width=(86+30*Math.sin(Math.PI*M.clamp(k)))+'px';}},
    {el:'Lcard', tin:tCard, tout:tPub, update:(t)=>{[0,1,2].forEach(i=>{M.$('b'+i).style.width=(500*[1,.8,.62][i]*M.eo((t-tCard-0.15-i*0.08)/0.4))+'px';});}},
    {el:'Lbtn2', tin:tPub, tout:null},            // same label again: last frame = first frame, so it loops
  ],
  cursor:{size:44, clicks:[tClick1,tTogClick], keys:[[0,260,220],[tClick1-0.35,60,30],[tDone,60,30],[tTogClick-0.3,40,20],[tCard+0.2,240,200],[tPub-0.3,40,110],[T,260,220]]},
});
M.cue(tClick1,'click'); M.cue(tClick1+0.05,'swipe',{g:0.4}); M.cue(tDone,'success',{g:0.5});
M.cue(tTog,'pop',{g:0.4}); M.cue(tTogClick,'click'); M.cue(tTogClick+0.05,'snap',{g:0.5});
M.cue(tCard,'whoosh',{g:0.4,d:0.4}); M.cue(tPub-0.3,'hover',{g:0.4}); M.cue(tPub,'swish',{g:0.4});
</script>
